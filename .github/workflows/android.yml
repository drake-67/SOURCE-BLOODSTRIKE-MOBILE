name: Android NDK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Patch missing deps
      run: |
        cd Bloodstrike_main/app/src/main/jni
        echo '// nyx stub' > /tmp/stub.h
        sed -i 's|#include <game-activity.*|struct android_app;|' Android_vulkan/CreateShaderModule.h || true
        sed -i 's|#include <shaderc.*|// no shaderc|' Android_vulkan/CreateShaderModule.cpp || true
        grep -rn "shaderc\|android_app" Android_vulkan/ || true
    - name: Build arm64
      run: |
        cd Bloodstrike_main/app/src/main/jni
        mkdir -p build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
        make -j4 -k || true
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Starcool-arm64
        path: Bloodstrike_main/app/src/main/jni/build/
