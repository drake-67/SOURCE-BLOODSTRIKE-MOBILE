name: Android NDK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Patch CMake
      run: |
        cd Bloodstrike_main/app/src/main/jni
        rm -f Android_vulkan/CreateShaderModule.cpp Android_vulkan/CreateShaderModule.h
        sed -i 's|target_link_libraries.*|target_link_libraries(Starcool.sh log z android GLESv2 EGL vulkan)|' CMakeLists.txt
        cat CMakeLists.txt | tail -n 10
    - name: Build arm64
      run: |
        cd Bloodstrike_main/app/src/main/jni
        rm -rf build && mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
        make -j4
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Starcool-arm64
        path: Bloodstrike_main/app/src/main/jni/build/Starcool.sh
