name: Android NDK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Build arm64
      run: |
        cd Bloodstrike_main/app/src/main/jni
        mkdir -p build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_shared
        sed -i 's|#include <game-activity.*|// patched by nyx|' ../Android_vulkan/CreateShaderModule.h || true
        make -j4
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Starcool-arm64
        path: Bloodstrike_main/app/src/main/jni/build/Starcool.sh
